name: Publish to PyPI

on:
  push:
    # Numeric segments only — `v0.2.1-rc1` and other pre-releases will NOT match.
    # If you want a pre-release tag to trigger a TestPyPI flow, add a separate job.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify tests pass before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest tests/ -x

  verify-release:
    name: Verify release metadata matches the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # v0.5.2 was tagged on a commit whose pyproject.toml still read 0.5.1.
      # `uv build` produced altr_mcp-0.5.1 and PyPI rejected the upload with
      # "400 File already exists". Nothing compared the two, so the mismatch
      # only surfaced after the release had already failed.
      #
      # Once the version is derived from the tag (#9), the built-version check
      # narrows to catching a broken checkout: with no tag reachable from HEAD
      # the build silently yields 0.0.0.post1.dev0+<sha> rather than erroring.
      # That is the whole job now — the changelog is generated after the
      # publish rather than verified before it.
      - name: Check the built version against the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          rm -rf dist
          uv build >/dev/null

          # Parse the version out of the wheel name rather than sed'ing the
          # path: a non-matching sed silently passes its input through, which
          # would report a filename as the "built version".
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          built=$(basename "${wheels[0]}")
          built=${built#altr_mcp-}
          built=${built%%-*}
          echo "tag=$version built=$built"

          fail=0
          if [ "$built" != "$version" ]; then
            echo "::error::built version $built does not match tag $version"
            fail=1
          fi
          # No changelog check here any more. CHANGELOG.md is generated from
          # the commits in the tag range by git-cliff (see the release job and
          # cliff.toml), so there is no hand-written section that could be
          # missing, empty, or out of order — the class of bug the old gate
          # existed to catch cannot occur.

          exit $fail

  publish:
    name: Build and publish to PyPI
    needs: [test, verify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-mcp:
    name: Publish to MCP Registry
    needs: publish            # only after the PyPI upload succeeds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write         # GitHub OIDC — proves the io.github.altrsoftware namespace
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Derived once so the version stamped into server.json and the version
      # waited for on PyPI cannot drift apart.
      - name: Resolve the release version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set version in server.json from the tag
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' \
            server.json > server.json.tmp
          mv server.json.tmp server.json
          # `.packages[] |= …` is a silent no-op on an empty array, so assert the
          # result instead of printing it.
          jq -e --arg v "$VERSION" '
            .version == $v
            and (.packages | length) > 0
            and all(.packages[]; .version == $v)
          ' server.json > /dev/null
          echo "stamped server.json to $VERSION"

      # The registry re-validates the PyPI package (and its mcp-name token) at
      # publish time, so wait until the tagged version is actually queryable.
      - name: Wait for the release on PyPI
        run: |
          version="$VERSION"
          echo "Waiting for altr-mcp==$version to appear on PyPI..."
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/altr-mcp/$version/json" >/dev/null 2>&1; then
              echo "Found altr-mcp==$version on PyPI."
              exit 0
            fi
            echo "  not yet (attempt $i); retrying in 10s"
            sleep 10
          done
          echo "::error::altr-mcp==$version did not appear on PyPI in time"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP Registry
        run: ./mcp-publisher publish

  changelog:
    name: Generate the changelog and the GitHub release
    needs: publish            # only once the artifact it describes is public
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # commits CHANGELOG.md back, creates the release
    steps:
      # ref: main rather than the tag — the generated CHANGELOG.md is committed
      # back to the branch, and a tag checkout is a detached HEAD with nothing
      # to push to. fetch-depth: 0 because git-cliff reads the whole tag graph.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # --latest is the section for the newest tag; --strip header drops the
      # Keep a Changelog preamble so the release body is just this version's
      # entries. cliff.toml is picked up from the repo root.
      - name: Render this release's notes
        run: uvx git-cliff --latest --strip header > /tmp/release-notes.md

      - name: Prepend the section to CHANGELOG.md
        run: uvx git-cliff --latest --prepend CHANGELOG.md

      # Nothing to commit is a normal outcome: a tag whose commits are all
      # chore/docs/test produces no entries, so the file is unchanged.
      - name: Commit CHANGELOG.md if it changed
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged — no release-note-worthy commits"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): add ${GITHUB_REF_NAME}

          Generated by git-cliff from the commits in this tag range.

          [skip ci]"
          git push origin main

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
