name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly Monday 09:00 UTC — re-scan against the latest CVE feed
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # required to upload SARIF to the Security tab

concurrency:
  # Per event, so a push to main never cancels the weekly run or vice versa.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy-fs:
    name: Trivy filesystem + secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          # Vulnerability + secret + misconfiguration detection
          scanners: "vuln,secret,misconfig"
          # Fail the build only on HIGH / CRITICAL findings; lower severities
          # surface in the Security tab without breaking the build
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to Security tab
        # Fails on Internal repos without GitHub Advanced Security (Code
        # Scanning is gated behind GHAS for non-Public visibility). Marking
        # this step non-fatal so the workflow stays green while we're Internal;
        # the upload starts working automatically once the repo flips to Public.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  report-failure:
    # A scheduled run has no pull request to show its result, so a failure
    # opens an issue instead of only emailing whoever last edited the cron.
    needs: [trivy-fs]
    # A job that times out ends as cancelled, not failed, so check both.
    if: >-
      always() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - run: .github/scripts/report-scheduled-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}
