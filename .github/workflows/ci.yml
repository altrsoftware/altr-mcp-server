name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Weekly, so a dependency release is tested even when nothing is pushed.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event, so a push to main never cancels the weekly run or vice versa.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv run --with flake8 flake8 altr_mcp/ tests/ scripts/

  test:
    name: test (python ${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every version requires-python permits. The wheel is py3-none-any,
        # so the interpreter does not change the artifact -- this is about
        # whether the code runs on the versions the package claims to
        # support. Kept in step with the classifiers in pyproject.toml by
        # test_python_support_is_consistent.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest tests/ -x

  test-newest:
    # A fresh install ignores the lockfile and resolves per interpreter, like
    # pip and uvx do. Test that, so a behavior change fails here first.
    name: test (newest dependencies, python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv venv && uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest tests/ -x

  test-redaction:
    # fastmcp reports a rejected argument three ways across the allowed range.
    # Keep the redaction tests running on each.
    name: test redaction (fastmcp ${{ matrix.fastmcp }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        fastmcp: ["3.2.4", "3.4.2"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]" "fastmcp==${{ matrix.fastmcp }}"
      - run: .venv/bin/python -m pytest tests/unit/test_logging.py tests/unit/test_middleware.py
